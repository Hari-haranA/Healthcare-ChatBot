<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthcare Chatbot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <div class="avatar">
            <img src="avatar.png" alt="Healthcare professional avatar">
        </div>
        <div class="chat-window">
            <div class="chat-bubble user">
                <p>Hi there! I'm feeling unwell. Can you help me?</p>
            </div>
            <div class="chat-bubble avatar">
                <p>Of course! Please tell me more about your symptoms.</p>
            </div>
            </div>
        <div class="input-bar">
            <input type="text" placeholder="Type your message here..." id="user-input">
            <button id="send-button">Send</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
