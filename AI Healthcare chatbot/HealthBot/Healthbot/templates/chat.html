<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Healthcare Chatbot</title>
    <style>
        <!-- Paste your existing CSS styles here -->
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="bot-name">
                <img src="{{ url_for('static', filename='avatar.png') }}" alt="Healthcare Chatbot Avatar">
                Healthcare Chatbot
            </div>
            <button id="exit-button" onclick="exitChat()" title="Exit Chat"></button>
        </div>
        <div class="chat-window" id="chat-window">
           <!-- Chat messages will be dynamically added here -->
            <div class="chat-bubble bot">
                <div class="bot-avatar">
                    <img src="{{ url_for('static', filename='avatar.png') }}" alt="Healthcare Chatbot Avatar" style="width: 22.5px; height: 22.5px;">
                </div>
                <p>
                    Welcome, dear {{ name }}! I am an AI healthcare assistant.
                    Kindly tell your symptoms, separated by commas, for disease diagnosis.
                </p>
            </div>

            {% for message in chat_history %}
                <div class="chat-bubble {{ message.sender }}">
                    {% if message.sender == 'user' %}
                        <div class="user-avatar"></div>
                    {% else %}
                        <div class="bot-avatar"></div>
                    {% endif %}
                    <p>{{ message.text }}</p>
                </div>
            {% endfor %}
        </div>
        <div class="input-bar">
            <textarea id="user-input" placeholder="Type your query here..." oninput="autoExpand(this)"></textarea>
            <button id="send-button" onclick="sendMessage()" onmouseover="this.style.height='auto'; this.style.height = (this.scrollHeight) + 'px';" onmouseout="this.style.height='auto';"></button>
        </div>
    </div>

    <script>
        function exitChat() {
            // Redirect to the "/chat_closed" route
            window.location.href = "/chat_closed";
        }

        function sendMessage() {
            var userInput = document.getElementById('user-input').value;

            if (userInput.trim() === '') {
                return;
            }

            // Update the user's chat bubble color to light green
            var userBubble = document.createElement('div');
            userBubble.className = 'chat-bubble user';
            userBubble.innerHTML = '<div class="user-avatar"></div><p style="background-color: #2ecc71;">' + userInput + '</p>';
            document.getElementById('chat-window').appendChild(userBubble);

            document.getElementById('user-input').value = '';

           // Simulate a response from the bot (replace this with actual server communication)
// Use the actual bot response received from the server
var botBubble = document.createElement('div');
botBubble.className = 'chat-bubble bot';
botBubble.innerHTML = '<div class="bot-avatar"></div><p style="background-color: #3498db;">' + bot_message + '</p>';
document.getElementById('chat-window').appendChild(botBubble);

document.getElementById('chat-window').scrollTop = document.getElementById('chat-window').scrollHeight;

function autoExpand(element) {
        element.style.height = 'auto';
        element.style.height = (element.scrollHeight) + 'px';
    }
    </script>
</body>
</html>
