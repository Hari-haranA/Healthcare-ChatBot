<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Closed</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f5f5; /* Light grey background */
            margin: 0;
            color: #333;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .message-container {
            max-width: 400px;
            padding: 20px;
            background-color: #fff; /* White container background */
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="message-container">
        <h1>Your current chat was Closed!</h1>
        <!-- Add any additional content or styling here -->
    </div>

    <script>
        // Close the window when the page loads
        window.close();
    </script>
</body>
</html>
