<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthcare Chatbot</title>
</head>
<body>
    <h1>Healthcare Chatbot</h1>
    <p>Welcome to the healthcare chatbot. Enter your symptoms below:</p>
    <form id="chat-form">
        <input type="text" id="user-input" placeholder="Type your symptoms..." required>
        <button type="button" onclick="predictDisease()">Predict</button>
    </form>
    <div id="bot-response"></div>

    <script>
        function predictDisease() {
            var userInput = document.getElementById('user-input').value;
            fetch('/predict', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: 'user_input=' + encodeURIComponent(userInput),
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('bot-response').innerText = 'Bot Response: ' + data.bot_response;
            })
            .catch(error => console.error('Error:', error));
        }
    </script>
</body>
</html>
